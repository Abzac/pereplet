name: Windows distributions

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py
      - name: Build and test portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test unpacked distribution
        shell: pwsh
        run: python scripts/smoke_windows.py
      - name: Build installer from verified portable payload
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Test installation, upgrade and data preservation
        shell: pwsh
        run: python scripts/smoke_installer.py
      - name: Verify release files and create shared checksums
        shell: pwsh
        run: python scripts/release_checksums.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: Pereplet-Tauri-Windows-x64
          path: |
            dist/Pereplet-Tauri-Windows-x64.zip
            dist/Pereplet-Tauri-Windows-x64.zip.sha256
            dist/Pereplet-Setup-Windows-x64.exe
            dist/Pereplet-Setup-Windows-x64.exe.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pereplet-Tauri-Windows-x64
          path: dist
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check Pereplet-Tauri-Windows-x64.zip.sha256
          sha256sum --check Pereplet-Setup-Windows-x64.exe.sha256
          sha256sum --check SHA256SUMS.txt
          # Never overwrite an already published release (including immutable releases).
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > ../is-draft.txt 2>/dev/null; then
            test "$(cat ../is-draft.txt)" = true || { echo 'Release is already published; use a new version tag.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Переплёт $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" Pereplet-Tauri-Windows-x64.zip Pereplet-Setup-Windows-x64.exe SHA256SUMS.txt --clobber
          # Attach everything before publishing, compatible with immutable releases.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
